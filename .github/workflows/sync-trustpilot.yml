name: Synchroniser les avis Trustpilot

on:
  push:
    branches:
      - master
      - dev
  schedule:
    # 05:17 UTC, soit 06:17 ou 07:17 à Paris selon l'heure d'hiver/d'été.
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: sync-trustpilot-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # MySQL utilise le réseau privé CapRover ; seul le portfolio y accède.
      - name: Synchroniser Trustpilot via le portfolio
        run: npm run sync:trustpilot:remote
        env:
          TRUSTPILOT_SITE_URL: ${{ github.ref_name == 'dev' && 'https://portfolio-dev.arnaudgct.fr' || 'https://arnaudgct.fr' }}
          API_TOKEN: ${{ github.ref_name == 'dev' && (secrets.API_TOKEN_DEV || secrets.API_TOKEN) || secrets.API_TOKEN }}
